<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEPT® | AI Marketing Maturity Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F4F3; color: #1E1E1E; }
        .dept-orange { color: #FF4901; }
        .bg-dept-orange { background-color: #FF4901; }
        .font-tight { font-weight: 900; letter-spacing: -0.05em; }
        [x-cloak] { display: none !important; }
        .matrix-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; background: #1E1E1E; padding: 2px; position: relative; }
        .matrix-cell { background: white; min-height: 180px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: flex-end; }
        .plot-point { width: 16px; height: 16px; background: #FF4901; border: 3px solid white; border-radius: 50%; position: absolute; transform: translate(-50%, -50%); z-index: 50; box-shadow: 0 0 15px rgba(255,73,1,0.6); transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .company-label { position: absolute; transform: translate(12px, -22px); white-space: nowrap; font-size: 10px; font-weight: 900; text-transform: uppercase; background: black; color: white; padding: 3px 8px; border-radius: 4px; }
        .pillar-1 { --p-color: #3b82f6; } .pillar-2 { --p-color: #8b5cf6; } .pillar-3 { --p-color: #6366f1; } 
        .pillar-4 { --p-color: #10b981; } .pillar-5 { --p-color: #f97316; } .pillar-6 { --p-color: #71717a; }
    </style>
</head>
<body x-data="assessment()" x-init="initStorage()" class="antialiased">

    <nav class="fixed top-0 w-full bg-white border-b border-slate-200 z-50 py-4 px-6 flex justify-between items-center no-print">
        <div class="flex items-center space-x-2">
            <svg width="25" height="25" viewBox="0 0 100 100"><path d="M50 0L58.5 31.5L90 25L70 50L90 75L58.5 68.5L50 100L41.5 68.5L10 75L30 50L10 25L41.5 31.5L50 0Z" fill="#FF4901"/></svg>
            <span class="font-tight text-lg uppercase tracking-tighter">DEPT<span class="text-slate-400">®</span></span>
        </div>
        <div x-show="step !== 'intro'" class="flex items-center space-x-6" x-cloak>
            <button @click="reset()" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 hover:text-black">Restart</button>
            <div class="w-32 bg-slate-200 h-1.5 rounded-full overflow-hidden">
                <div class="bg-dept-orange h-full transition-all duration-500" :style="'width:' + progress + '%'"></div>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-12 px-6">
        <section x-show="step === 'intro'" class="max-w-4xl mx-auto text-center py-20">
            <h1 class="text-6xl md:text-8xl font-tight uppercase mb-8 leading-none tracking-tighter">AI Marketing Maturity Assessment</h1>
            <div class="max-w-md mx-auto mb-12">
                <input type="text" x-model="companyName" placeholder="Your Company Name" class="w-full p-5 rounded-2xl border-2 border-slate-200 focus:border-dept-orange text-center text-xl font-bold">
            </div>
            <button @click="start()" :disabled="!companyName" class="bg-black text-white px-12 py-5 rounded-full font-bold text-xl hover:bg-dept-orange tracking-widest disabled:opacity-20 uppercase">Start Diagnostic</button>
        </section>

        <section x-show="step === 'pillarIntro'" x-cloak class="max-w-4xl mx-auto py-20 text-center">
            <span class="bg-black text-white text-[10px] font-bold uppercase px-4 py-2 rounded-full mb-6 inline-block">Strategic Pillar <span x-text="currentPillarIndex + 1"></span></span>
            <h2 class="text-6xl font-tight uppercase mb-8" x-text="pillars[currentPillarIndex].name"></h2>
            <div class="bg-white p-10 rounded-[40px] shadow-2xl border-t-8 border-dept-orange">
                <p class="text-2xl text-slate-600 italic leading-relaxed" x-text="pillars[currentPillarIndex].insight"></p>
            </div>
            <button @click="step = 'quiz'" class="mt-12 bg-black text-white px-12 py-5 rounded-full font-bold uppercase tracking-widest hover:bg-dept-orange">Enter Pillar</button>
        </section>

        <section x-show="step === 'gate'" x-cloak class="max-w-2xl mx-auto text-center py-20">
            <h2 class="text-4xl font-tight uppercase mb-6 leading-tight">Maturity Progress Saved.</h2>
            <p class="text-slate-600 mb-10 text-lg">Enter your professional email to unlock the final strategic layers and your plotted diagnosis.</p>
            <input type="email" x-model="email" placeholder="Professional Email Address" class="w-full p-5 rounded-2xl border-2 border-slate-200 text-center text-xl font-bold mb-6">
            <button @click="unlockGate()" :disabled="!email.includes('@')" class="bg-dept-orange text-white px-12 py-5 rounded-full font-bold uppercase tracking-widest">Unlock Remaining Pillars</button>
        </section>

        <section x-show="step === 'quiz'" x-cloak class="max-w-7xl mx-auto" :class="'pillar-' + (currentPillarIndex + 1)">
