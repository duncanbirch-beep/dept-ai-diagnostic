<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEPT® | AI Marketing Maturity Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F4F3; color: #1E1E1E; }
        .dept-orange { color: #FF4901; }
        .bg-dept-orange { background-color: #FF4901; }
        .font-tight { font-weight: 900; letter-spacing: -0.05em; }
        [x-cloak] { display: none !important; }
        .matrix-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; background: #1E1E1E; padding: 4px; }
        .matrix-cell { background: white; transition: all 0.3s ease; cursor: pointer; position: relative; overflow: hidden; min-height: 120px; }
        .matrix-cell.active { background: #FF4901; color: white; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body x-data="assessment()" class="antialiased">

    <nav class="fixed top-0 w-full bg-white border-b border-slate-200 z-50 py-4 px-6 flex justify-between items-center no-print">
        <div class="flex items-center space-x-2">
            <svg width="30" height="30" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 0L58.5 31.5L90 25L70 50L90 75L58.5 68.5L50 100L41.5 68.5L10 75L30 50L10 25L41.5 31.5L50 0Z" fill="#FF4901"/>
            </svg>
            <span class="font-tight text-xl uppercase tracking-tighter">DEPT<span class="text-slate-400">®</span></span>
        </div>
        <div x-show="step === 'quiz'" class="flex items-center space-x-4">
            <div class="w-32 md:w-48 bg-slate-200 h-2 rounded-full overflow-hidden">
                <div class="bg-dept-orange h-full transition-all duration-500" :style="'width:' + progress + '%'"></div>
            </div>
            <span class="text-xs font-bold text-slate-500" x-text="progress + '%'"></span>
        </div>
    </nav>

    <main class="pt-24 pb-12 px-6">
        <section x-show="step === 'intro'" x-cloak class="max-w-4xl mx-auto text-center py-20">
            <h1 class="text-5xl md:text-7xl font-tight uppercase mb-8 leading-none tracking-tighter">The World Doesn't Wait for Growth.<br><span class="dept-orange italic underline">Together we can invent it.</span></h1>
            <p class="text-xl text-slate-600 mb-12 max-w-2xl mx-auto font-medium">DEPT® AI Marketing Maturity Assessment. Identify your strategic bottlenecks and move from 'Pilot Purgatory' to scaled execution.</p>
            <button @click="step = 'quiz'" class="bg-[#1E1E1E] text-white px-12 py-5 rounded-full font-bold text-xl hover:bg-dept-orange transition-all shadow-xl uppercase tracking-wider">Start Assessment</button>
        </section>

        <section x-show="step === 'quiz'" x-cloak class="max-w-2xl mx-auto">
            <template x-if="currentQuestion">
                <div class="animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div class="mb-10">
                        <span class="bg-dept-orange text-white text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-4 inline-block" x-text="currentQuestion.pillar"></span>
